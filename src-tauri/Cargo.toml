[package]
name = "conductor"
version = "0.1.7"
description = "A lightweight, fast desktop API client"
authors = ["Yara Miri"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "conductor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Lets AI agents drive the webview over MCP. Enabled for isolated agent builds.
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
bytes = "1"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.52.2", features = ["fs"] }
tokio-util = { version = "0.7.17", features = ["io"] }
thiserror = "2.0.18"
uuid = { version = "1.23.1", features = ["v4"] }
chrono = "0.4.44"
rusqlite = { version = "0.32.1", features = ["bundled"] }
# Same major version and TLS setup as tauri-plugin-updater, so only one
# reqwest and one rustls (with ring, not aws-lc-rs) are compiled.
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "multipart", "query", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "=0.0.12"
# Keep in lockstep with @hypothesi/tauri-mcp-server in .mcp.json.
tauri-plugin-mcp-bridge = { version = "=0.13.0", optional = true }
tauri-plugin-updater = "=2.12.0"
tauri-plugin-process = "=2.3.1"

# Roughly halves the shipped binary (19 MB to 11 MB) at the cost of slower
# release compiles. Panics still unwind so a failing command doesn't take the
# whole app down.
[profile.release]
lto = true
codegen-units = 1
strip = true
