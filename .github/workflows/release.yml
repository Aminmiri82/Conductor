name: Release

on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing draft tag to build or retry (for example app-v0.1.3)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.release-tag }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
      sha: ${{ steps.draft.outputs.sha }}
      notes: ${{ steps.draft.outputs.notes }}
    steps:
      - name: Resolve the draft's exact commit
        id: draft
        uses: actions/github-script@v8
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            if (!/^app-v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected app-vX.Y.Z');
            // The tag lookup only returns published releases; listing includes drafts.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const release = releases.find((release) => release.tag_name === tag);
            if (!release) throw new Error(`Release ${tag} was not found`);
            if (!release.draft) throw new Error('Refusing to replace a published release');
            const { data: commit } = await github.rest.repos.getCommit({ ...context.repo, ref: tag });
            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo, basehead: `${commit.sha}...main`,
            });
            if (!['ahead', 'identical'].includes(comparison.status)) throw new Error('Release commit is not on main');
            if (release.target_commitish !== commit.sha) throw new Error('Draft and tag must point to the same immutable commit');
            if (!release.body?.trim()) throw new Error('Draft is missing generated release notes');
            // Uploading to an existing release ID does not apply tauri-action's releaseName.
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: release.id, tag_name: tag,
              name: `Conductor v${tag.slice('app-v'.length)}`,
            });
            core.setOutput('id', release.id);
            core.setOutput('sha', commit.sha);
            core.setOutput('notes', release.body);

  mac:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Check release versions
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node scripts/check-release-version.mjs
      - run: pnpm check
      - run: git diff --exit-code -- src-tauri/Cargo.lock src/bindings.ts
      - name: Build release draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ inputs.release-tag }}
          releaseBody: ${{ needs.draft.outputs.notes }}
          releaseDraft: true
          args: --target aarch64-apple-darwin --bundles app,dmg --config src-tauri/tauri.release.conf.json
      # Records what this release ships and compares it with the last published
      # release, so the numbers are in front of Yara before the draft is
      # published. Report only: PRs are where budgets block.
      - name: Record release sizes
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          release=src-tauri/target/aarch64-apple-darwin/release
          node scripts/perf-size.mjs measure --binary "$release/conductor" \
            --dmg "$(ls "$release"/bundle/dmg/*.dmg | head -n 1)" --out perf-size.json
          gh release upload "$RELEASE_TAG" perf-size.json --clobber
          previous=$(gh release list --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          if [ -n "$previous" ] && gh release download "$previous" --pattern perf-size.json --output previous-perf-size.json; then
            node scripts/perf-size.mjs compare previous-perf-size.json perf-size.json
          else
            echo "No perf-size.json on the previous release yet; this release starts the baseline."
            node scripts/perf-size.mjs compare perf-size.json perf-size.json
          fi

  windows:
    # Runs after the Mac build, not beside it: tauri-action merges each
    # platform into the draft's latest.json, and two jobs rewriting it at once
    # would drop one platform from the updater.
    needs: [draft, mac]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The NSIS installer is the .exe users download. It installs per user,
      # so it needs no admin rights, and it is also the signed updater artifact.
      - name: Build release draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ inputs.release-tag }}
          releaseBody: ${{ needs.draft.outputs.notes }}
          releaseDraft: true
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.release.conf.json

  linux:
    # Last in the latest.json chain, for the same reason Windows waits on Mac.
    needs: [draft, windows]
    # The oldest supported Ubuntu, because a binary built against a newer glibc
    # won't start on older systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.draft.outputs.sha }}
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # The .deb is the native Ubuntu install and the AppImage runs on most
      # distros; the updater installs either.
      - name: Build release draft
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          tagName: ${{ inputs.release-tag }}
          releaseBody: ${{ needs.draft.outputs.notes }}
          releaseDraft: true
          args: --target x86_64-unknown-linux-gnu --bundles deb,appimage --config src-tauri/tauri.release.conf.json
