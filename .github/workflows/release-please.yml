name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release-created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # GITHUB_TOKEN-created PRs don't trigger pull_request workflows.
      - name: Run checks on the bot's updated PR
        if: steps.release.outputs.prs_created == 'true'
        uses: actions/github-script@v8
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        with:
          script: |
            for (const pr of JSON.parse(process.env.RELEASE_PRS)) {
              const { data } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'checks.yml', ref: data.head.ref,
              });
            }

  build:
    needs: prepare
    if: needs.prepare.outputs.release-created == 'true'
    uses: ./.github/workflows/mac-release.yml
    with:
      release-tag: ${{ needs.prepare.outputs.tag }}
    secrets: inherit
